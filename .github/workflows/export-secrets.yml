name: Export & Encrypt Secrets for Actor
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment prefix (e.g. dev, staging, prod)'
        required: true
        default: 'dev'

permissions:
  contents: read      # for checkout
  actions: read       # to list/download runs & artifacts

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      # 1) checkout your code
      - name: Checkout
        uses: actions/checkout@v3

      # 2) export only the secrets for the chosen environment
      - name: Export environment-prefixed secrets
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}
          include: ${{ inputs.environment }}_
          exclude: GITHUB_TOKEN

      # 3) dump everything in env → secrets.env
      - name: Dump to secrets.env
        run: env > secrets.env

      # 4) fetch the actor’s public GPG keys
      - name: Fetch GPG keys for ${{ github.actor }}
        id: fetch_keys
        run: |
          ACTOR=${{ github.actor }}
          echo "🔎 Fetching public GPG keys for $ACTOR"
          # get JSON array of {key_id, raw_key}
          gh api /users/"$ACTOR"/gpg_keys \
            --jq '[.[] | .raw_key]' > actor_keys.json

      # 5) import + fingerprint + encrypt in one go
      - name: Import & encrypt for actor
        run: |
          # read every raw_key, import it, extract fingerprint, build --recipient args
          mapfile -t RAW_KEYS < <(jq -r '.[]' actor_keys.json)
          RECIP_ARGS=()
          for raw in "${RAW_KEYS[@]}"; do
            echo "$raw" | gpg --batch --import
            # dry-run import to get fingerprint
            FP=$(printf '%s' "$raw" \
                 | gpg --import-options import-show --dry-run --with-colons \
                 | awk -F: '/^fpr:/ {print $10; exit}')
            RECIP_ARGS+=(--recipient "$FP")
          done

          # fail early if user has no keys
          if [[ ${#RECIP_ARGS[@]} -eq 0 ]]; then
            echo "❌ No public GPG keys found for $ACTOR — aborting" >&2
            exit 1
          fi

          echo "🔒 Encrypting secrets.env for $ACTOR…"
          gpg --yes --batch --quiet \
              "${RECIP_ARGS[@]}" \
              --output secrets.env.gpg \
              secrets.env

      # 6) upload the encrypted file
      - name: Upload encrypted-secrets
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets
          path: secrets.env.gpg
          retention-days: 1
