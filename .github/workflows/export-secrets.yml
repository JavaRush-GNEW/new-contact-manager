# .github/workflows/export-secrets.yml
name: Export & Encrypt Secrets for Actor

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment prefix (e.g. dev, staging, prod)'
        required: true
        default: 'dev'

permissions:
  contents: read      # for checkout
  actions: read       # to list/download runs & artifacts

jobs:
  export:
    runs-on: ubuntu-latest

    # Make sure gh CLI calls are authenticated
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Export environment-prefixed secrets
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}
          include: ${{ inputs.environment }}_
          exclude: GITHUB_TOKEN

      - name: Dump to secrets.env
        run: env > secrets.env

      - name: Fetch GPG keys for ${{ github.actor }}
        id: fetch_keys
        run: |
          echo "🔎 Fetching public GPG keys for ${{ github.actor }}…"
          gh api /users/${{ github.actor }}/gpg_keys --jq '[.[] | .raw_key]' > actor_keys.json

      - name: Import & encrypt for actor
        run: |
          mapfile -t RAW_KEYS < <(jq -r '.[]' actor_keys.json)
          RECIP_ARGS=()
          for raw in "${RAW_KEYS[@]}"; do
            echo "$raw" | gpg --batch --import
            FP=$(printf '%s' "$raw" \
                 | gpg --import-options import-show --dry-run --with-colons \
                 | awk -F: '/^fpr:/ {print $10; exit}')
            RECIP_ARGS+=(--recipient "$FP")
          done

          if [[ ${#RECIP_ARGS[@]} -eq 0 ]]; then
            echo "❌ No GPG keys found for ${{ github.actor }}." >&2
            exit 1
          fi

          echo "🔒 Encrypting secrets.env for ${{ github.actor }}…"
          gpg --yes --batch --quiet \
              "${RECIP_ARGS[@]}" \
              --output secrets.env.gpg \
              secrets.env

      - name: Upload encrypted-secrets
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets
          path: secrets.env.gpg
          retention-days: 1
