name: Export & Encrypt Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (e.g. dev, staging, prod)'
        required: true
        default: 'dev'

permissions:
  contents: read      # for checkout
  actions: read       # to list/download runs/artifacts

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Export only this environment’s secrets as env-vars
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}
          exclude: ENV_PASSPHRASE
          include: ${{ inputs.environment }}_

      - name: Dump ALL exported vars to .env
        run: |
          # Now every secret that matched “<env>_…” is in the env
          env > secrets.env

      - name: Encrypt .env symmetrically
        run: |
          gpg --quiet --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "${{ secrets.ENV_PASSPHRASE }}" \
              --cipher-algo AES256 \
              --symmetric \
              --output secrets.env.gpg \
              secrets.env

      - name: Upload encrypted .env
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets
          path: secrets.env.gpg
          retention-days: 1
