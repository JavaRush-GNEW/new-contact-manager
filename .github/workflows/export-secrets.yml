# .github/workflows/export-secrets.yml
name: Export & Encrypt Secrets for Actor

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment prefix (e.g. dev, staging, prod)'
        required: true
        default: 'dev'

permissions:
  contents: read      # for checkout
  actions: read       # to list/download runs & artifacts

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Export environment-prefixed secrets
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}
          include: ${{ inputs.environment }}_
          exclude: GITHUB_TOKEN

      - name: Dump to secrets.env
        run: env > secrets.env

      - name: Fetch GPG keys for ${{ github.actor }}
        run: |
          echo "🔎 Fetching public GPG keys for ${{ github.actor }}…"
          gh api /users/${{ github.actor }}/gpg_keys \
            --jq '[.[] | .raw_key]' > actor_keys.json

      - name: Ensure actor has ≥1 GPG key
        run: |
          COUNT=$(jq 'length' actor_keys.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No public GPG keys found for ${{ github.actor }}."
            echo "   Please upload a key at https://github.com/settings/keys"
            exit 1
          fi

      - name: Import & encrypt for actor
        run: |
          # Load all raw_key blocks into a stream
          KEYS_STREAM=$(jq -r '.[]' actor_keys.json)

          RECIP_ARGS=()
          BUFFER=""

          # Assemble and import each armored key block
          while IFS= read -r line; do
            BUFFER+="$line"$'\n'
            if [[ "$line" == "-----END PGP PUBLIC KEY BLOCK-----" ]]; then
              # Extract fingerprint in one go (dry-run import-show)
              FP=$(printf '%s\n' "$BUFFER" \
                   | gpg --batch --import-options import-show --dry-run --with-colons \
                   2>/dev/null \
                   | awk -F: '/^fpr:/ {print $10; exit}')

              # Sanity check
              if [[ -z "$FP" ]]; then
                echo "❌ Failed to extract fingerprint for a key block." >&2
                exit 1
              fi

              RECIP_ARGS+=(--recipient "$FP")

              # Now do the real import so the key actually lives in your keyring
              printf '%s\n' "$BUFFER" | gpg --batch --import >/dev/null

              BUFFER=""
            fi
          done <<< "$KEYS_STREAM"

          # Ensure we got at least one recipient
          if [[ ${#RECIP_ARGS[@]} -eq 0 ]]; then
            echo "❌ No valid GPG keys found to encrypt for ${{ github.actor }}." >&2
            exit 1
          fi

          echo "🔒 Encrypting secrets.env for ${{ github.actor }} (keys: ${RECIP_ARGS[*]})…"
          gpg --yes --batch --quiet \
              --trust-model always \
              --encrypt \
              "${RECIP_ARGS[@]}" \
              --output secrets.env.gpg \
              secrets.env


      - name: Upload encrypted-secrets
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets
          path: secrets.env.gpg
          retention-days: 1
