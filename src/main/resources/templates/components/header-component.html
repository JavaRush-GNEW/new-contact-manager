<header class="bg-white" xmlns:sec="http://www.w3.org/1999/xhtml">
    <div class="mx-auto max-w-screen-xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
            <div class="flex-1 md:flex md:items-center md:gap-12">
                <a class="block text-teal-600" th:href="@{/}">
                    <span class="sr-only">Home</span>
                    <img src="/img/logo.png" alt="Home" class="h-16 w-16 rounded-full">
                </a>
            </div>

            <div class="md:flex md:items-center md:gap-12">
                <nav aria-label="Global" class="hidden md:block">
                    <ul class="flex items-center gap-6 text-sm">
                        <li>
                            <a class="text-gray-500 transition hover:text-gray-500/75" href="https://github.com/JavaRush-GNEW/new-contact-manager/blob/spring-boot/README.MD"> About </a>
                        </li>

                        <li>
                            <a class="text-gray-500 transition hover:text-gray-500/75" th:href="@{/swagger-ui.html}"> API </a>
                        </li>

                        <li>
                            <a class="text-gray-500 transition hover:text-gray-500/75" href="https://github.com/JavaRush-GNEW/new-contact-manager"> Github </a>
                        </li>

                        <li>
                            <a class="text-gray-500 transition hover:text-gray-500/75" href="https://github.com/JavaRush-GNEW/new-contact-manager/graphs/contributors"> Contributors </a>
                        </li>

                    </ul>
                </nav>

                <div class="flex items-center gap-4">

                    <div class="sm:flex sm:gap-4" sec:authorize="!isAuthenticated()">
                        <a
                                class="rounded-md bg-teal-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm"
                                th:href="@{/login}"
                        >
                            Login
                        </a>

                        <div class="hidden sm:flex">
                            <a
                                    class="rounded-md bg-gray-100 px-5 py-2.5 text-sm font-medium text-teal-600"
                                    th:href="@{/register}"
                            >
                                Register
                            </a>
                        </div>
                    </div>

                    <div sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post">
                            <button
                                    type="submit"
                                    class="rounded-md bg-gray-100 px-5 py-2.5 text-sm font-medium text-teal-600"
                            >
                                Logout
                            </button>
                        </form>
                    </div>

                </div>

                    <div class="block md:hidden">
                        <button
                                class="rounded-sm bg-gray-100 p-2 text-gray-600 transition hover:text-gray-600/75"
                        >
                            <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="size-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    stroke-width="2"
                            >
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
