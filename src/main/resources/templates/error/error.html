<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Error ' + ${status} + ' – ' + ${error}">Error</title>
    <link th:href="@{/main.css}" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center">

<div class="container mx-auto px-5">

    <!-- Top: two-column flex -->
    <div class="flex flex-col md:flex-row items-center justify-between text-gray-700 mb-8">

        <!-- Left column: status, message, link -->
        <div class="w-full lg:w-1/2 mx-8 mb-8 md:mb-0">
            <div class="text-7xl text-teal-500 font-extrabold mb-8" th:text="${status}">500</div>
            <p class="text-2xl md:text-3xl font-light leading-normal mb-8"
               th:text="${message}">
                An unexpected error occurred.
            </p>
            <a th:href="@{/}"
               class="px-5 py-3 text-sm font-medium leading-5 shadow-lg text-white rounded-lg bg-teal-600 hover:bg-teal-700 transition">
                Back to homepage
            </a>
        </div>

        <!-- Right column: illustration -->
        <div class="w-full lg:w-1/2 mx-5 flex justify-end">
            <img src="https://user-images.githubusercontent.com/43953425/166269493-acd08ccb-4df3-4474-95c7-ad1034d3c070.svg"
                 alt="Page not found"
                 class="max-w-full h-auto">
        </div>
    </div>

    <!-- Bottom: full-width scrollable details -->
    <div th:if="${trace}" class="w-full bg-gray-100 p-6 rounded shadow-inner">
        <h2 class="text-xl font-semibold mb-4">Details:</h2>
        <div class="h-64 overflow-y-auto p-4 bg-white rounded">
            <pre th:text="${trace}" class="whitespace-pre-wrap"></pre>
        </div>
    </div>

</div>

</body>
</html>
