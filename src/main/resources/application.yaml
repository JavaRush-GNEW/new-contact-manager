spring:
  profiles:
    default: dev
    active: ${SPRING_PROFILE:dev}
  application:
    name: contact-manager-spring-boot
  jpa:
    hibernate:
      ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      format_sql: true		
logging:
  level: 
    ua.com.javarush.gnew.contactm: DEBUG
    org.springframework.security: DEBUG

cloudinary:
  name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}