spring:
  profiles:
    default: dev
    active: ${SPRING_PROFILE:dev}
  application:
    name: contact-manager-spring-boot
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}   # falls back to localhost if not set
      port: ${REDIS_PORT:6379}        # falls back to 6379
      password: ${REDIS_PASSWORD:}        # empty if not set
      ssl:
        enabled: ${REDIS_SSL:false}        # enable SSL if you set REDIS_SSL=true
      lettuce:
        pool:
          max-active: ${REDIS_MAX_ACTIVE:8}
          max-idle: ${REDIS_MAX_IDLE:8}
          min-idle: ${REDIS_MIN_IDLE:0}
  show-sql: true
  properties:
    hibernate:
      format_sql: true
logging:
  level: 
    ua.com.javarush.gnew.contactm: DEBUG
    org.springframework.security: DEBUG

cloudinary:
  name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}